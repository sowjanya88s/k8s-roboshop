apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
  labels:
  # property-like keys; each key maps to a simple value
    project: roboshop
    env: dev
    component: payment
data: 
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: payment
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: payment
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: payment
    spec:
      containers:
      - name: payment
        image: jujjurisowjanya/payment:1.4.0
        imagePullPolicy: Always
        resources:
          requests:
           memory: "125Mi"
           cpu: "100m"
          limits:
           memory: "256Mi"
           cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 2
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
           path: /health
           port: 8080
          failureThreshold: 2
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: payment
---
apiVersion: v1
kind: Service
metadata:
 name: payment
 namespace: roboshop
 labels:
   project: roboshop
   env: dev
   component: payment
spec:
  selector:
    project: roboshop
    env: dev
    component: payment
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080