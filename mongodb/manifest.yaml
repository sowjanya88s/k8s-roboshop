apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: mongodb 
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: mongodb
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: mongodb
    spec:
      containers:
      - name: mongodb
        image: jujjurisowjanya/mongodb:1.4.0
---
apiVersion: v1
kind: Service
metadata:
 name: mongodb
 namespace: roboshop
spec:
  selector:
    project: roboshop
    env: dev
    component: mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017