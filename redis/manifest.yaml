apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: redis-rs
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: redis
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: redis
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: redis
    spec:
      containers:
      - name: redis
        image: jujjurisowjanya/redis:1.4.0
---
apiVersion: v1
kind: Service
metadata:
 name: redis-service
spec:
  selector:
    project: roboshop
    env: dev
    component: redis
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017