apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: mysql
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: mysql
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: mysql
    spec:
      containers:
      - name: mysql
        image: jujjurisowjanya/mysql:1.4.0
---
apiVersion: v1
kind: Service
metadata:
 name: mysql
 namespace: roboshop
spec:
  selector:
    project: roboshop
    env: dev
    component: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306