apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
  # property-like keys; each key maps to a simple value
    project: roboshop
    env: dev
    component: cart
data: 
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: cart
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: cart
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: cart
    spec:
      containers:
      - name: cart
        image: jujjurisowjanya/cart:1.4.0
        imagePullPolicy: Always
        resources:
          requests:
           memory: "64Mi"
           cpu: "250m"
          limits:
           memory: "128Mi"
           cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 2
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
           path: /health
           port: 8080
          failureThreshold: 2
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: cart-cm
---
apiVersion: v1
kind: Service
metadata:
 name: cart
 namespace: roboshop
 labels:
   project: roboshop
   env: dev
   component: cart
spec:
  selector:
    project: roboshop
    env: dev
    component: cart
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080